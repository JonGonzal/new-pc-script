# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# allow truecolor
set -g default-terminal "screen-256color"
set -ga terminal-overrides ',xterm*:kbs=\177'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
# moved to M-r since tmux-lazy-restore claims prefix+r for session revert
bind M-r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

bind -r k select-pane -U
bind -r j select-pane -D
bind -r l select-pane -R
bind -r h select-pane -L

set-option -g repeat-time 0
set-option -sg escape-time 10

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
set -g history-limit 50000

# don't rename windows automatically
set-option -g allow-rename off
set -g allow-passthrough on

bind-key c command-prompt -p "Window name:" "new-window -n '%%'"

# use vi mode
setw -g mode-keys vi
set -g status-keys vi

# Status bar - left: session + pane info
set -g status-left-length 50
set -g status-left "#[bg=colour46,fg=black,bold] #S #[bg=colour238,fg=colour46] #I:#P #[default] "

# Status bar - right: time/date
set -g status-right-length 80
set -g status-right "#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD) #[fg=white] | jon | #[fg=white]%H:%M | #[fg=white]%b-%d-%y"

# Colors
set -g status-style bg='#BF5700',fg=black
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=colour46,fg=black,bold] #I:#W "
set -g window-status-current-style bg=colour46,fg=black,bold
set -g pane-border-style fg=colour34
set -g pane-active-border-style fg=colour46

set -s set-clipboard on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'bcampolo/tmux-lazy-restore'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @oasis_flavor "cactus_dark"
# don't tint inactive panes with the flavor's own bg; every pane uses the terminal bg that nvim sets
set -g @oasis_dim_inactive off
# nvim's <leader>tt writes this file to switch flavor (cactus_dark <-> moonlight_light_3)
source-file -q ~/.local/state/nvim/tmux_flavor.conf

# tmux-lazy-restore key overrides (avoid clobbering prefix+r reload / free up C-s)
set -g @tmux-lazy-restore-save-all-key 'M-s'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# plugin sets both its default C-s and our M-s override; drop the stale default
unbind -T prefix C-s

# Shortcuts
# Capital K so lowercase k stays "select pane up".
# prefix+a toggles between the current and previous window
bind a last-window
# rename session (prefix+, already renames window; prefix+r belongs to lazy-restore)
bind R command-prompt -I "#S" "rename-session '%%'"
# new named session
bind N command-prompt -p "Session name:" "new-session -s '%%'"

# Pane labels (after TPM: tmux-oasis resets pane-border-status/format to off/empty): show session:window.pane target + @name in the border.
# Name a pane with prefix+P, or: tmux set-option -p @name <label>
set -g pane-border-status top
set -g pane-border-format " #{session_name}:#{window_index}.#{pane_index} | #{?@name,#{@name},#{pane_current_command}} "
bind P command-prompt -p "Pane name:" "set-option -p @name '%%'"
