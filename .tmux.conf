# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# allow truecolor
set -g default-terminal "screen-256color"
set -ga terminal-overrides ',xterm*:kbs=\177'


set -g base-index 1

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

bind -r k select-pane -U
bind -r j select-pane -D
bind -r l select-pane -R
bind -r h select-pane -L

set-option -g repeat-time 0
set-option -sg escape-time 10

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
set -g history-limit 50000

# don't rename windows automatically
set-option -g allow-rename off
set -g allow-passthrough on

bind-key c command-prompt -p "Window name:" "new-window -n '%%'"

# use vi mode
setw -g mode-keys vi
set -g status-keys vi

set -g @plugin 'Djuuu/tmux-git-status'

# Status bar - left: session + pane info
set -g status-left-length 50
set -g status-left "#[bg=colour46,fg=black,bold] #S #[bg=colour238,fg=colour46] #I:#P #[default] "

# Status bar - right: time/date
set -g status-right-length 80
set -g status-right "#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD)' | #[fg=colour46]#H | #[fg=colour46]%H:%M | #[fg=colour46]%b-%d-%y"

# Colors
set -g status-style bg=colour235,fg=white
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=colour46,fg=black,bold] #I:#W "
set -g window-status-current-style bg=colour46,fg=black,bold
set -g pane-border-style fg=colour34
set -g pane-active-border-style fg=colour46

